<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room — PostBoard</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .chat-layout { max-width: 780px; margin: 0 auto; }
    .chat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: 520px;
    }
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .chat-title { font-size: 16px; font-weight: 700; flex: 1; }
    .chat-timer {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #fb923c;
      background: rgba(251,146,60,0.1);
      border: 1px solid rgba(251,146,60,0.3);
      padding: 3px 10px;
      border-radius: 99px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .chat-msg-author {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      min-width: 90px;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .chat-msg-author.anon { color: var(--text-muted); }
    .chat-msg-text { font-size: 13px; color: var(--text); word-break: break-word; flex: 1; }
    .chat-msg-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); padding-top: 3px; flex-shrink: 0; }
    .chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--accent); }
    .live-dot {
      width: 7px; height: 7px;
      background: var(--like);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--like);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">PostBoard<span class="nav-logo-dot"></span></a>
  <div class="nav-right" id="nav-right"></div>
</nav>
<div id="auth-modal-container"></div>
<div class="container">
  <div class="chat-layout">
    <a href="/" class="back-link">← All Rooms</a>
    <div id="chat-container">
      <div class="chat-box">
        <div class="chat-header">
          <div class="skeleton" style="width:200px;height:16px;"></div>
        </div>
        <div class="chat-messages">
          <div class="skeleton" style="width:80%;height:13px;"></div>
          <div class="skeleton" style="width:60%;height:13px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="/js/utils.js"></script>
<script>
  document.getElementById('auth-modal-container').innerHTML = authModalHTML();

  const roomId = location.pathname.split('/').pop();
  let timerSeconds = 0;
  let timerInterval = null;
  let lastSent = 0;

  function escapeHTML(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatTimer(s) {
    if (s <= 0) return '00:00';
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function appendMessage(msg, scroll = true) {
    const list = document.getElementById('chat-messages');
    if (!list) return;
    const empty = list.querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `
      <span class="chat-msg-author ${msg.username === 'Anonymous' ? 'anon' : ''}">${escapeHTML(msg.username)}</span>
      <span class="chat-msg-text">${escapeHTML(msg.text)}</span>
      <span class="chat-msg-time">${timeAgo(msg.created_at)}</span>
    `;
    list.appendChild(div);
    if (scroll) list.scrollTop = list.scrollHeight;
  }

  function resetTimer() {
    timerSeconds = 30 * 60;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timerSeconds--;
      const el = document.getElementById('chat-timer');
      if (el) el.textContent = formatTimer(timerSeconds);
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        showToast('Room expired!');
        setTimeout(() => window.location.href = '/', 2000);
      }
    }, 1000);
  }

  async function loadRoom(user) {
    try {
      const room = await apiFetch(`/api/rooms/${roomId}`);
      const canDelete = user.loggedIn && room.username === user.username;
      timerSeconds = room.expires_in;

      document.title = `${room.title} — PostBoard`;

      document.getElementById('chat-container').innerHTML = `
        <div class="chat-box">
          <div class="chat-header">
            <div class="live-dot"></div>
            <span class="chat-title">${escapeHTML(room.title)}</span>
            ${room.tag ? `<span class="post-tag post-tag-${room.tag}">${room.tag}</span>` : ''}
            <span class="chat-timer" id="chat-timer">${formatTimer(timerSeconds)}</span>
            ${canDelete ? `<button class="btn btn-danger" id="delete-room-btn">✕</button>` : ''}
          </div>
          <div class="chat-messages" id="chat-messages">
            <p class="chat-empty" style="font-size:13px;color:var(--text-muted);text-align:center;margin:auto;">No messages yet. Say something!</p>
          </div>
          <div class="chat-input-area">
            <input class="chat-input" id="chat-input" placeholder="Send a message…" maxlength="500">
            <button class="btn btn-primary" id="chat-send">Send</button>
          </div>
        </div>
      `;

      // Load history
      const messages = await apiFetch(`/api/rooms/${roomId}/messages`);
      messages.forEach(m => appendMessage(m, false));
      const list = document.getElementById('chat-messages');
      list.scrollTop = list.scrollHeight;

      // Start timer
      resetTimer();

      // Delete room
      if (canDelete) {
        document.getElementById('delete-room-btn').onclick = async () => {
          if (!confirm('Delete this room?')) return;
          await apiFetch(`/api/rooms/${roomId}`, { method: 'DELETE' });
          window.location.href = '/';
        };
      }

      // Send message
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        const now = Date.now();
        if (now - lastSent < 2500) {
          showToast('Please wait before sending again.');
          return;
        }
        lastSent = now;
        input.value = '';
        try {
          await apiFetch(`/api/rooms/${roomId}/messages`, {
            method: 'POST',
            body: JSON.stringify({ text })
          });
        } catch(e) { showToast(e.message); }
      }

      sendBtn.onclick = sendMessage;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

      // Ably real-time
      try {
        const ably = new Ably.Realtime({ key: 'uj-aLw.L2yDPw:SwVRbfZkTHvqBV3u0QekfJJ3XBfqXw2BALcqnDfZ-XI' });
        const channel = ably.channels.get(`room-${roomId}`);
        channel.subscribe('message', (msg) => {
          appendMessage(msg.data);
          resetTimer();
        });
      } catch(e) {
        console.error('Ably error:', e);
      }

    } catch(e) {
      document.getElementById('chat-container').innerHTML =
        `<div class="empty-state"><div class="empty-icon">💨</div><p>Room not found or has expired.</p></div>`;
    }
  }

  (async () => {
    const user = await loadUser();
    renderNav(user);
    initAuthModal();
    await loadRoom(user);
  })();
</script>
</body>
</html>
