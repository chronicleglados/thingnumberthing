<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Room — PostBoard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <a href="/" class="nav-logo">PostBoard<span class="nav-logo-dot"></span></a>
  <div class="nav-right" id="nav-right"></div>
</nav>
<div id="auth-modal-container"></div>
<div class="container">
  <div class="form-page">
    <a href="/" class="back-link">← Back</a>
    <div class="page-header"><h1 class="page-title">New Chat Room</h1></div>

    <div id="login-required" style="display:none;" class="anon-notice">
      You must be <a id="login-link">logged in</a> to create a chat room.
    </div>

    <div class="form-card" id="form-card">
      <form id="room-form">
        <div class="form-group">
          <label class="form-label">Title <span style="color:var(--dislike);">*</span></label>
          <input class="form-input" id="room-title" placeholder="What's this room about?" required>
        </div>
        <div class="form-group">
          <label class="form-label">Tag</label>
          <div class="tag-selector">
            <button type="button" class="tag-option selected" data-tag="">None</button>
            <button type="button" class="tag-option" data-tag="Proxy">Proxy</button>
            <button type="button" class="tag-option" data-tag="Mirror">Mirror</button>
            <button type="button" class="tag-option" data-tag="Bypass">Bypass</button>
            <button type="button" class="tag-option" data-tag="Exploit">Exploit</button>
            <button type="button" class="tag-option" data-tag="CVE">CVE</button>
            <button type="button" class="tag-option" data-tag="XSS">XSS</button>
            <button type="button" class="tag-option" data-tag="SQLi">SQLi</button>
            <button type="button" class="tag-option" data-tag="Tool">Tool</button>
            <button type="button" class="tag-option" data-tag="OSINT">OSINT</button>
            <button type="button" class="tag-option" data-tag="Payload">Payload</button>
            <button type="button" class="tag-option" data-tag="Misc">Misc</button>
          </div>
        </div>
        <p class="form-hint" style="margin-bottom:16px;">Room expires 30 minutes after the last message.</p>
        <p class="error-msg" id="form-error"></p>
        <div style="display:flex;gap:12px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Create Room</button>
          <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="/js/utils.js"></script>
<script>
  document.getElementById('auth-modal-container').innerHTML = authModalHTML();
  let selectedTag = '';
  document.querySelectorAll('.tag-option').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tag-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTag = btn.dataset.tag;
    };
  });
  document.getElementById('room-form').onsubmit = async (e) => {
    e.preventDefault();
    const title = document.getElementById('room-title').value.trim();
    const errEl = document.getElementById('form-error');
    if (!title) { errEl.textContent = 'Title is required.'; return; }
    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Creating…'; btn.disabled = true;
    try {
      const data = await apiFetch('/api/rooms', {
        method: 'POST',
        body: JSON.stringify({ title, tag: selectedTag })
      });
      window.location.href = `/room/${data.id}`;
    } catch(e) {
      errEl.textContent = e.message;
      btn.textContent = 'Create Room'; btn.disabled = false;
    }
  };
  (async () => {
    const user = await loadUser();
    renderNav(user);
    initAuthModal();
    if (!user.loggedIn) {
      document.getElementById('login-required').style.display = 'block';
      document.getElementById('form-card').style.opacity = '0.4';
      document.getElementById('form-card').style.pointerEvents = 'none';
      document.getElementById('login-link').onclick = () => openAuthModal();
    }
  })();
</script>
</body>
</html>
